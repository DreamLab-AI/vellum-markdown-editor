name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Install scripts are not needed to build and are not run.
      - run: npm ci --ignore-scripts
      # ESLint with the repo's own config: errors fail the build, warnings do not.
      - run: npm run lint
      - run: npm run test:unit
      # Verifies the pinned Pele, Paged.js, Ontomark graph and vowl-wasm digests, then bundles.
      - run: npm run package
      - run: npx @vscode/vsce package --out vellum.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vellum-vsix
          path: vellum.vsix
          retention-days: 14
